name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch numpy scipy pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Upload coverage
        if: success()
        run: |
          echo "=== Coverage Summary ==="
          python -m pytest tests/ --cov=src --cov-report=term-missing 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check syntax
        run: |
          python -m py_compile src/sensors/tactile.py
          python -m py_compile src/sensors/force.py
          python -m py_compile src/sensors/imu.py
          python -m py_compile src/control/agv.py
          python -m py_compile src/learning/world_model.py
          python -m py_compile src/learning/dreamer_agent.py
          echo "All modules compile successfully"
