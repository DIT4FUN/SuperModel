# SuperModel AGV-XXL 级配置
# 旗舰全功能级 - 多机协作/户外全地形，算力 > 300 TOPS
# 价格: > ¥500,000

project:
  name: "SuperModel-AGV-XXL"
  version: "0.1.0"
  grade: "XXL"
  description: "旗舰全功能超模态机器人具身智能大脑"

# 感知系统配置
sensors:
  vision:
    enabled: true
    type: "多目 + 3D LiDAR"
    resolution: [1920, 1080]
    fps: 120
    camera_count: 4
    baseline_mm: 200  # 多目基线范围
    depth_range_m: [0.1, 30.0]
    fov_deg: 180
    depth_accuracy_mm: 1.0  # @ 2m
    lidar: true
    lidar_range_m: 100
    
  audio:
    enabled: true
    type: "8-Mic 阵列"
    sample_rate: 44100
    channels: 8
    beamforming: true
    multi_beam: true
    pickup_range_m: 10.0
    source_localization_accuracy_deg: 1
    
  tactile:
    enabled: true
    type: "旗舰触觉阵列"
    array_size: [48, 48]
    resolution_bits: 16
    pressure_range_kpa: [0, 10000]
    sampling_hz: 1000
    temperature: true
    proximity: true
    humidity: true
    
  force:
    enabled: true
    type: "ATI Force/Torque (旗舰)"
    axes: 6
    force_range: 5000  # N
    torque_range: 500  # N·m
    resolution_n: 0.005
    sampling_hz: 5000
    interface: "EtherCAT"
    
  imu:
    enabled: true
    type: "ADIS16470 (高精度)"
    accel_range: 80   # g
    gyro_range: 8000  # deg/s
    sampling_hz: 2000
    noise_density: 10  # μg/√Hz
    bias_stability_deg_s: 0.02

# 融合系统配置
fusion:
  strategy: "early_middle_late"  # 早期+中期+晚期
  hidden_dim: 1024
  num_heads: 16
  num_layers: 8
  dropout: 0.1
  feature_dim: 1024
  inference_latency_ms: 2
  gnn_fusion: true
  multi_agent_fusion: true

# 认知系统配置
model:
  # 世界模型 - 高精度完整版
  world_model:
    enabled: true
    grade: "XXL"
    latent_dim: 1024
    hidden_dim: 2048
    imagination_horizon: 30
    parameters: "~100M"
    
  # 学习配置
  learning:
    enabled: true
    lr: 1e-4
    batch_size: 256
    temperature: 0.1
    curiosity_weight: 0.5
    world_model_weight: 0.8
    reinforcement_learning: "full_rl"  # 完整RL
    self_supervised: true
    knowledge_graph: "large_scale"
    active_learning: true
    continual_learning: true
    meta_learning: true  # 元学习
    adversarial_learning: true

# 执行系统配置
control:
  control_rate_hz: 1000
  position_precision_mm: 0.01
  force_precision_n: 0.05
  impedance_control: true
  impedance_type: "full_adaptive_metal"  # 自适应阻抗+力学
  admittance_control: true
  force_position_hybrid: true
  predictive_control: true
  max_payload_kg: 200
  
  # 安全配置
  safety:
    soft_limits: true
    hard_limits: true
    collision_detection_visual: true
    collision_detection_force: true
    predictive_collision: true
    force_limited: true
    emergency_stop: true
    safety_zone_monitoring: true
    human_robot_collaboration: true
    predictive_safety: true
    vibration_monitoring: true
    predictive_maintenance: true

# 硬件平台配置
hardware:
  platform: "NVIDIA DRIVE / 服务器"
  compute_device: "cuda"
  cpu: "64核 A78AE"
  gpu_tops: 1000
  memory_gb: 256
  power_w: 200
  protection_class: "IP67"

# 通信接口
communication:
  wired: "EtherCAT/光口"
  wireless: "5G / LoRa"
  control_api: "多协议"
  realtime: "dual_system"  # 双系统

# 软件功能
software:
  slam: "3D+语义+动态"
  object_recognition: "万级+零件级"
  scene_understanding: "因果推理"
  voice_interaction: "情感计算"
  visual_servo: "adaptive"
  autonomous_navigation: "群体+学习"
  digital_twin: "realtime_sync"  # 实时同步
  remote_operation: true
  edge_computing: true
  cloud_edge_collaboration: true

# 尺寸与重量
dimensions:
  typical_cm: [120, 100, 150]
  weight_kg: 200
  installation: "重载臂+复合平台"
